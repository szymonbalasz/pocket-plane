<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Pocket Plane</title>
    <script>
      // Theme before first paint (theme-system FR-THEME-01, -04; store: @ui/themes/theme.ts):
      // `pp.theme.v1` = {"theme": "<id>"}; `default` (Simple Dark) = no attribute; none → Gilt &
      // Stone (DM #355); unreadable → Gilt & Stone + warning.
      (() => {
        let theme = "gilt";
        try {
          const raw = localStorage.getItem("pp.theme.v1");
          if (raw !== null) {
            const stored = JSON.parse(raw).theme;
            if (!["default", "gilt"].includes(stored)) throw new Error(`unknown theme ${stored}`);
            theme = stored;
          }
        } catch (err) {
          console.warn("theme: stored choice unreadable; using Gilt & Stone", err);
        }
        if (theme !== "default") document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
